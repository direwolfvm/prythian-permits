# Baseline Dependabot config (playbooks/dependabot.md in direwolfvm/operator).
# This repo has no CI yet, so nothing auto-merges: review each PR before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    # Wait until a release is 5 days old. Security updates are not delayed.
    cooldown:
      default-days: 5
    groups:
      # The @rjsf packages must move together (one PR), or npm ci fails.
      rjsf:
        patterns: ["@rjsf/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CopilotKit must match the shared runtime (playbooks/copilotkit.md in
      # direwolfvm/operator). Upgrade client and runtime together; never let
      # Dependabot bump these alone.
      - dependency-name: "@copilotkit/*"
      # Majors are planned cross-app upgrade waves, not weekly PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Base image majors follow the Node LTS plan, not Dependabot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
